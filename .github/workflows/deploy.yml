name: Deploy MCP Services

on:
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.changes.outputs.gateway }}
      services: ${{ steps.services.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          # Manual dispatch: always deploy gateway (user pressed the button)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch — forcing gateway=true"
            echo "gateway=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Use event before..HEAD to handle squash-merge and batch pushes correctly
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # First push to branch — compare with parent
            BASE="HEAD~1"
          fi
          CHANGED_FILES=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if gateway changed
          if echo "$CHANGED_FILES" | grep -q '^gateway/'; then
            echo "gateway=true" >> "$GITHUB_OUTPUT"
          else
            echo "gateway=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find changed MCP services
        id: services
        run: |
          # Manual dispatch: always deploy all MCP services (user pressed the button)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ALL_SERVICES="[]"
            for dir in */; do
              dir="${dir%/}"
              if [ -f "$dir/wrangler.jsonc" ] && [ "$dir" != "gateway" ] && [ "$dir" != "_template" ]; then
                ALL_SERVICES=$(echo "$ALL_SERVICES" | jq -c ". + [\"$dir\"]")
              fi
            done
            echo "list=$ALL_SERVICES" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch — deploying all services: $ALL_SERVICES"
            exit 0
          fi

          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          CHANGED_FILES=$(git diff --name-only "$BASE" HEAD)

          # Find all dirs with wrangler.jsonc (= deployable services), exclude gateway and _template
          CHANGED_SERVICES="[]"
          for dir in $(echo "$CHANGED_FILES" | grep -v '^gateway/' | grep -v '^_template/' | cut -d'/' -f1 | sort -u); do
            if [ -f "$dir/wrangler.jsonc" ]; then
              CHANGED_SERVICES=$(echo "$CHANGED_SERVICES" | jq -c ". + [\"$dir\"]")
            fi
          done

          # Also redeploy all services if _shared changed (skills/agents/types affect all)
          if echo "$CHANGED_FILES" | grep -q '^_shared/'; then
            ALL_SERVICES="[]"
            for dir in */; do
              dir="${dir%/}"
              if [ -f "$dir/wrangler.jsonc" ] && [ "$dir" != "gateway" ] && [ "$dir" != "_template" ]; then
                ALL_SERVICES=$(echo "$ALL_SERVICES" | jq -c ". + [\"$dir\"]")
              fi
            done
            CHANGED_SERVICES="$ALL_SERVICES"
          fi

          echo "list=$CHANGED_SERVICES" >> "$GITHUB_OUTPUT"
          echo "Services to deploy: $CHANGED_SERVICES"

  deploy-services:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install --frozen-lockfile

      # wrangler-action calls `wrangler deploy` directly, so skill-runner's `predeploy`
      # script never runs and start_building would serve whatever bundle was last committed.
      - name: Bundle builder docs
        if: matrix.service == 'skill-runner'
        run: node skill-runner/scripts/bundle-docs.js

      - name: Deploy ${{ matrix.service }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.service }}

  deploy-gateway:
    needs: [detect-changes, deploy-services]
    if: always() && (needs.detect-changes.outputs.gateway == 'true' || needs.detect-changes.outputs.services != '[]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install --frozen-lockfile

      - name: Deploy gateway
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gateway
