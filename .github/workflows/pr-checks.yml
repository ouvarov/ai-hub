name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# The deterministic pre-merge gate the ReviewBot LLM review cannot provide.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit, all workspaces)
        run: pnpm typecheck

      - name: Lint (eslint)
        run: pnpm lint

      - name: Test (vitest)
        run: pnpm test
